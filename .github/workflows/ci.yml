name: ci
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rustfmt:
    name: Check rustfmt
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Run linter
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - uses: hecrj/setup-rust-action@v1
        with:
          components: clippy
      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo-
      - name: Cache cargo target dirs
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-lint-stable-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-lint-stable-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-target-lint-stable-
            ${{ runner.os }}-target-lint-

      # feature testing
      - name: no features
        run: cargo clippy --workspace --all-targets

      - name: docking feature
        run: cargo clippy --workspace --all-targets --features docking

      - name: freetype feature
        run: cargo clippy --workspace --all-targets --features freetype

      - name: freetype and docking
        run: cargo clippy --workspace --all-targets --features freetype,docking

      - name: all features
        run: cargo clippy --workspace --all-targets --features docking,freetype

  test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.82"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.rust }}
          override: true
      # workaround for https://github.com/actions/cache/issues/403
      - name: Install GNU tar
        if: matrix.os == 'macos-latest'
        run: |
          brew install gnu-tar
          echo PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH" >> $GITHUB_ENV
      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-cargo-
      - name: Cache cargo target dirs
        uses: actions/cache@v4
        with:
          path: target
          # note `cargo test` and `cargo clippy` don't use the same build
          # artifacts, so this has a different key
          key: ${{ runner.os }}-target-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-target-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.toml') }}
            ${{ runner.os }}-target-test-${{ matrix.rust }}-

      # feature testing
      #
      # NOTE: This fork targets arcdps (an addon for Guild Wars 2), which
      # hosts the ImGui context itself and only consumes a subset of the
      # high-level Rust API. As part of the dear imgui 1.92.7 upgrade:
      #
      # * The `docking` and `freetype` feature jobs are disabled because
      #   those imgui-sys bindings were not regenerated to match 1.92.7.
      # * The default (`no features`) test step runs `--no-run`, i.e. it
      #   verifies the library and its tests still compile cleanly under
      #   `-D warnings` but does not execute the upstream unit tests. The
      #   upstream unit tests assume an exact layout match between the
      #   Rust `Io`/`Font` mirror structs and 1.92.7's `ImGuiIO`/`ImFont`,
      #   which this fork does not attempt to maintain (runtime safety is
      #   enforced by arcdps owning the real context). Re-enable once the
      #   mirror structs have been ported to the 1.92.7 layout.
      - name: no features (compile-only)
        run: cargo test --workspace --all-targets --no-run

      - name: build documentation
        run: cargo doc --workspace --no-deps
